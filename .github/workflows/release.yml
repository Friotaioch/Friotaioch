name: Build Release Binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix mingw-w64-tools \
            cmake ninja-build curl python3 pkg-config bison
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-win-v2-${{ hashFiles('depends/packages/*.mk', 'depends/hosts/*.mk') }}
      - name: Build depends (Windows)
        run: |
          make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)
      - name: Configure
        run: |
          cmake -B build_win --toolchain depends/x86_64-w64-mingw32/toolchain.cmake -DBUILD_GUI=ON -DENABLE_IPC=OFF
      - name: Build
        run: |
          cmake --build build_win -j$(nproc) --target bitcoin-qt bitcoind bitcoin-cli
      - name: Strip & package
        run: |
          x86_64-w64-mingw32-strip build_win/bin/friotaioch-qt.exe build_win/bin/friotaiochd.exe build_win/bin/friotaioch-cli.exe
          mkdir -p Friotaioch-win64
          cp build_win/bin/friotaioch-qt.exe build_win/bin/friotaiochd.exe build_win/bin/friotaioch-cli.exe README.md COPYING Friotaioch-win64/
          zip -r Friotaioch-${GITHUB_REF_NAME}-win64.zip Friotaioch-win64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: Friotaioch-*-win64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Friotaioch-*-win64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libssl-dev \
            libevent-dev libboost-dev pkg-config python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-5compat-dev \
            libgl1-mesa-dev libqrencode-dev
      - name: Build
        run: |
          cmake -B build -DBUILD_GUI=ON -DENABLE_IPC=OFF
          cmake --build build -j$(nproc) --target bitcoin-qt bitcoind bitcoin-cli
      - name: Package
        run: |
          strip build/bin/friotaiochd build/bin/friotaioch-cli build/bin/friotaioch-qt
          mkdir -p Friotaioch-linux64
          cp build/bin/friotaiochd build/bin/friotaioch-cli build/bin/friotaioch-qt README.md COPYING Friotaioch-linux64/
          tar czf Friotaioch-${GITHUB_REF_NAME}-linux64.tar.gz Friotaioch-linux64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: Friotaioch-*-linux64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Friotaioch-*-linux64.tar.gz
